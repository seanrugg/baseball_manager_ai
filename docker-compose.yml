version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baseball-manager-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./models:/app/models
      - ./data:/app/data
      - ./results:/app/results
    restart: unless-stopped
    networks:
      - baseball-network

networks:
  baseball-network:
    driver: bridge
